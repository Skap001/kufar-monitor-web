<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kufar Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --btn_blue: #2481cc; 
            --btn_text: #ffffff;
            --card_bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --border: var(--tg-theme-section-separator-color, #2f3b4a);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .screen { display: none; flex-direction: column; height: 100vh; }
        .screen.active { display: flex; }
        .main-content { padding: 16px; padding-bottom: 90px; flex: 1; overflow-y: auto; }
        h1 { font-size: 20px; margin: 0 0 16px 0; }
        
        /* Увеличенная строка поиска */
        .search-input { 
            width: 100%; 
            background-color: var(--card_bg); 
            border: none; 
            padding: 18px; 
            border-radius: 12px; 
            color: var(--text); 
            font-size: 18px; /* Больше шрифт */
            box-sizing: border-box; 
            margin-bottom: 20px; 
            outline: none; 
        }
        .search-input::placeholder { color: var(--hint); }
        
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 18px; font-weight: 600; touch-action: manipulation; }
        .menu-item .main-text { color: var(--text); display: flex; align-items: center; gap: 10px; flex: 1; margin-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .menu-item .arrow-right { color: var(--hint); font-size: 24px; font-weight: 300; }
        
        .price-block { margin-top: 28px; }
        .price-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
        .price-inputs { display: flex; gap: 12px; width: 100%; margin-bottom: 16px; }
        .price-inputs input { flex: 1 1 0; min-width: 0; width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
        
        .quick-filters { display: flex; gap: 16px; margin-bottom: 24px; }
        .filter-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; }
        .filter-checkbox .checkbox { width: 22px; height: 22px; border: 2px solid var(--hint); border-radius: 6px; display: flex; justify-content: center; align-items: center; box-sizing: border-box; background-color: transparent; }
        .filter-checkbox.selected .checkbox { background-color: var(--btn_blue); border-color: var(--btn_blue); }
        .filter-checkbox .checkbox::after { content: ''; display: none; width: 6px; height: 11px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .filter-checkbox.selected .checkbox::after { display: block; }

        /* Кнопка Выбрать фильтры и Сброс */
        .filter-actions { display: flex; gap: 12px; align-items: stretch; margin-top: 10px; }
        .btn-filters { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; background-color: var(--card_bg); color: var(--text); border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        /* Улучшенная кнопка сброса */
        .btn-reset { 
            width: 56px; 
            height: auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: var(--card_bg); 
            color: var(--text); /* Белая */
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
        }
        .btn-reset svg { width: 24px; height: 24px; fill: currentColor; }
        
        .bottom-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background-color: var(--bg); border-top: 1px solid var(--border); }
        .save-btn { width: 100%; padding: 16px; background-color: var(--btn_blue); color: var(--btn_text); border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .back-btn { font-size: 36px; font-weight: 900; line-height: 1; padding-right: 16px; color: var(--btn_blue); cursor: pointer; user-select: none; margin-top: -4px; }
        .list-title { font-size: 22px; font-weight: 700; margin: 0; }
        
        .list-search-wrapper { padding: 16px; }
        .list-search { width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
        
        .list-container { padding: 0 16px; overflow-y: auto; flex: 1; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); font-size: 17px; cursor: pointer; touch-action: manipulation; outline: none; }
        .list-item:active { background-color: var(--card_bg); }
        
        .check-mark-only { display: none; color: var(--btn_blue); font-size: 24px; font-weight: bold; }
        .list-item.selected .check-mark-only { display: block; }
        
        .checkbox { width: 26px; height: 26px; border: 2px solid var(--hint); border-radius: 6px; display: flex; justify-content: center; align-items: center; box-sizing: border-box; background-color: transparent; transition: 0.1s; }
        .selected .checkbox { background-color: var(--btn_blue); border-color: var(--btn_blue); }
        .checkbox::after { content: ''; display: none; width: 7px; height: 13px; border: solid white; border-width: 0 3px 3px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .selected .checkbox::after { display: block; }
        
        .arrow { color: var(--hint); font-size: 28px; font-weight: 300; padding-left: 10px; user-select: none; margin-top: -4px;}
        
        .apply-block { padding: 16px; background-color: var(--bg); }
        .apply-btn { width: 100%; padding: 16px; background-color: var(--btn_blue); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        
        .select-cat-btn { display: flex; align-items: center; gap: 12px; padding: 16px; background-color: var(--card_bg); border-radius: 10px; margin-bottom: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation; color: var(--text); font-size: 17px; }
        .blue-square-check { width: 24px; height: 24px; background-color: var(--btn_blue); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; }
        .select-all-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background-color: var(--card_bg); border-radius: 10px; margin-bottom: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation; outline: none; font-size: 17px;}
        .select-all-row .checkbox { border-color: var(--hint); }
        .select-all-row.selected .checkbox { background-color: var(--btn_blue); border-color: var(--btn_blue); }
        .search-result-path { font-size: 13px; color: var(--hint); margin-top: 4px; }

        /* Экран фильтров */
        .filter-screen-content { padding: 16px; padding-bottom: 100px; flex: 1; overflow-y: auto; }
        .filter-group { margin-bottom: 24px; }
        .filter-group-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
        .filter-options { display: flex; flex-direction: column; gap: 8px; }
        .filter-option { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background-color: var(--card_bg); border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .filter-option.selected { border-color: var(--btn_blue); }
        .filter-option .radio-circle { width: 20px; height: 20px; border: 2px solid var(--hint); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .filter-option.selected .radio-circle { border-color: var(--btn_blue); }
        .filter-option.selected .radio-circle::after { content: ''; width: 10px; height: 10px; background: var(--btn_blue); border-radius: 50%; }
    </style>
</head>
<body>
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="screen active">
        <div class="main-content">
            <h1>Новый поиск</h1>
            <input type="text" id="query" class="search-input" placeholder="🔍 Что вы ищете?">
            
            <div class="menu-item" onclick="openList('category')">
                <div class="main-text" id="display-category">📦 Выбрать категорию</div>
                <div class="arrow-right">›</div>
            </div>
            
            <div class="menu-item" onclick="openList('location')">
                <div class="main-text" id="display-location">📍 Выбрать локацию</div>
                <div class="arrow-right">›</div>
            </div>
            
            <div class="price-block">
                <div class="price-title">Цена (BYN)</div>
                <div class="price-inputs">
                    <input type="number" id="price_min" placeholder="От">
                    <input type="number" id="price_max" placeholder="До">
                </div>
            </div>

            <div class="quick-filters">
                <div class="filter-checkbox" id="chk-free" onclick="toggleQuickFilter('free')">
                    <div class="checkbox"></div> <span>Бесплатно</span>
                </div>
                <div class="filter-checkbox" id="chk-neg" onclick="toggleQuickFilter('neg')">
                    <div class="checkbox"></div> <span>Договорная</span>
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn-filters" onclick="showScreen('filters-screen')">
                    <span>⚙️ Выбрать фильтры</span>
                </button>
                <button class="btn-reset" onclick="resetAll()" title="Сбросить всё">
                    <!-- Красивая SVG иконка сброса -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="bottom-btn"><button class="save-btn" onclick="sendData()">Сохранить и начать</button></div>
    </div>

    <!-- ЭКРАН СПИСКОВ -->
    <div id="list-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="goBack()">←</div>
            <h2 id="list-title" class="list-title">Выбор</h2>
        </div>
        <div class="list-search-wrapper">
            <input type="text" id="list-search" class="list-search" placeholder="Поиск..." oninput="filterList()">
        </div>
        <div class="list-container" id="list-container"></div>
        <div class="apply-block" id="apply-container" style="display: none;">
            <button class="apply-btn" onclick="applyLocation()">Применить</button>
        </div>
    </div>

    <!-- ЭКРАН ФИЛЬТРОВ -->
    <div id="filters-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="showScreen('main-screen')">←</div>
            <h2 class="list-title">Все фильтры</h2>
        </div>
        <div class="filter-screen-content">
            <!-- Состояние -->
            <div class="filter-group">
                <div class="filter-group-title">Состояние</div>
                <div class="filter-options">
                    <div class="filter-option selected" data-val="" onclick="selectOption(this, 'condition')">Не важно <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="new" onclick="selectOption(this, 'condition')">Новое <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="used" onclick="selectOption(this, 'condition')">Б/у <div class="radio-circle"></div></div>
                </div>
            </div>

            <!-- Продавец -->
            <div class="filter-group">
                <div class="filter-group-title">Продавец</div>
                <div class="filter-options">
                    <div class="filter-option selected" data-val="" onclick="selectOption(this, 'seller')">Не важно <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="private" onclick="selectOption(this, 'seller')">Частное лицо <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="company" onclick="selectOption(this, 'seller')">Компания <div class="radio-circle"></div></div>
                </div>
            </div>

            <!-- Сортировка -->
            <div class="filter-group">
                <div class="filter-group-title">Сортировка</div>
                <div class="filter-options">
                    <div class="filter-option selected" data-val="lst.d" onclick="selectOption(this, 'sort')">Актуальные (Сначала новые) <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="prc.a" onclick="selectOption(this, 'sort')">Сначала дешевле <div class="radio-circle"></div></div>
                    <div class="filter-option" data-val="prc.d" onclick="selectOption(this, 'sort')">Сначала дороже <div class="radio-circle"></div></div>
                </div>
            </div>
        </div>
        <div class="bottom-btn">
            <button class="save-btn" onclick="showScreen('main-screen')">Применить</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let selectedCategory = null; 
        let selectedLocations = []; 
        
        let categoriesData = [];
        let regionsData = [];
        let currentListType = "";
        let historyStack = []; 
        let currentRenderParentId = "0";

        // Фильтры
        let filterState = {
            isFree: false,
            isNeg: false,
            condition: "",
            seller: "",
            sort: "lst.d" // По умолчанию Актуальные
        };

        fetch('categories.json').then(r => r.json()).then(data => categoriesData = data);
        fetch('regions.json').then(r => r.json()).then(data => regionsData = data);

        updateMainDisplay();

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- ФИЛЬТРЫ ---
        function toggleQuickFilter(type) {
            if (type === 'free') {
                filterState.isFree = !filterState.isFree;
                document.getElementById('chk-free').classList.toggle('selected', filterState.isFree);
            } else {
                filterState.isNeg = !filterState.isNeg;
                document.getElementById('chk-neg').classList.toggle('selected', filterState.isNeg);
            }
        }

        function selectOption(el, group) {
            const parent = el.closest('.filter-options');
            parent.querySelectorAll('.filter-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            filterState[group] = el.getAttribute('data-val');
        }

        function resetAll() {
            document.getElementById('query').value = '';
            document.getElementById('price_min').value = '';
            document.getElementById('price_max').value = '';
            
            selectedCategory = null;
            selectedLocations = [];
            
            filterState = { isFree: false, isNeg: false, condition: "", seller: "", sort: "lst.d" };
            document.getElementById('chk-free').classList.remove('selected');
            document.getElementById('chk-neg').classList.remove('selected');
            
            // Сброс радио-кнопок
            document.querySelectorAll('.filter-options').forEach(group => {
                group.querySelectorAll('.filter-option').forEach((opt, index) => {
                    if (index === 0) opt.classList.add('selected');
                    else opt.classList.remove('selected');
                });
            });

            updateMainDisplay();
            showScreen('main-screen');
        }

        // --- ОСТАЛЬНОЙ КОД (Категории, Локации, Поиск) ---
        function openList(type) {
            currentListType = type;
            historyStack = [{ id: "0", name: type === 'category' ? "Категории" : "Локация" }];
            document.getElementById('list-search').value = '';
            renderList("0", type === 'category' ? "Категории" : "Локация");
            showScreen('list-screen');
        }

        function renderList(parentId, title) {
            currentRenderParentId = parentId;
            document.getElementById('list-title').innerText = title;
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            document.getElementById('apply-container').style.display = (currentListType === 'location' && parentId !== "0") ? "block" : "none";
            container.style.paddingBottom = (currentListType === 'location' && parentId !== "0") ? "90px" : "0";

            if (currentListType === 'category') renderCategoryList(parentId, title);
            else renderLocationList(parentId, title);
        }

        function renderCategoryList(parentId, title) {
            const container = document.getElementById('list-container');
            if (parentId === "0") {
                const isAll = (selectedCategory === null || selectedCategory.id === 'all');
                const allItem = document.createElement('div');
                allItem.className = `list-item ${isAll ? 'selected' : ''}`;
                allItem.innerHTML = `<span>Все категории</span> <span class="check-mark-only">✓</span>`;
                allItem.onclick = () => { selectedCategory = { id: "all", name: "Все категории", slug: "" }; updateMainDisplay(); showScreen('main-screen'); };
                container.appendChild(allItem);
            } else {
                const selectCurrent = document.createElement('div');
                selectCurrent.className = 'select-cat-btn';
                selectCurrent.innerHTML = `<div class="blue-square-check">✓</div> <span>Выбрать: ${title}</span>`;
                selectCurrent.onclick = () => {
                    const node = categoriesData.find(i => i.id === parentId && i.name === title);
                    if (node) { selectedCategory = { id: node.id, name: node.name, slug: node.slug }; updateMainDisplay(); showScreen('main-screen'); }
                };
                container.appendChild(selectCurrent);
            }

            const listWrapper = document.createElement('div');
            listWrapper.id = 'actual-list';
            categoriesData.filter(item => item.parent_id === parentId).forEach(item => {
                const hasChildren = categoriesData.some(child => child.parent_id === item.id);
                const isSelected = (selectedCategory && selectedCategory.id === item.id && selectedCategory.name === item.name);
                const div = document.createElement('div');
                div.className = `list-item ${isSelected ? 'selected' : ''}`;
                div.setAttribute('data-name', item.name.toLowerCase());
                div.innerHTML = `
                    <span style="flex: 1; padding: 10px 0;" onclick="event.stopPropagation(); ${hasChildren ? `goInside('${item.id}', '${item.name}')` : `selectLeafCategory('${item.id}', '${item.name}', '${item.slug}')`}">${item.name}</span>
                    ${hasChildren ? `<span class="arrow" onclick="event.stopPropagation(); goInside('${item.id}', '${item.name}')">›</span>` : `<span class="check-mark-only">✓</span>`}
                `;
                div.onclick = () => { if (hasChildren) goInside(item.id, item.name); else selectLeafCategory(item.id, item.name, item.slug); };
                listWrapper.appendChild(div);
            });
            container.appendChild(listWrapper);
        }

        function selectLeafCategory(id, name, slug) {
            selectedCategory = { id: id, name: name, slug: slug };
            updateMainDisplay();
            showScreen('main-screen');
        }

        function renderLocationList(parentId, title) {
            const container = document.getElementById('list-container');
            if (parentId === "0") {
                const isAll = (selectedLocations.length === 0 || (selectedLocations.length === 1 && selectedLocations[0].id === 'all'));
                const allItem = document.createElement('div');
                allItem.className = `list-item ${isAll ? 'selected' : ''}`;
                allItem.innerHTML = `<span>Вся Беларусь</span> <span class="check-mark-only">✓</span>`;
                allItem.onclick = () => { selectedLocations = [{ id: 'all', name: 'Вся Беларусь' }]; updateMainDisplay(); showScreen('main-screen'); };
                container.appendChild(allItem);

                const listWrapper = document.createElement('div');
                listWrapper.id = 'actual-list';
                regionsData.filter(item => item.parent_id === "0").forEach(reg => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.setAttribute('data-name', reg.name.toLowerCase());
                    div.innerHTML = `<span style="flex:1; padding:10px 0;">${reg.name}</span> <span class="arrow">›</span>`;
                    div.onclick = () => goInside(reg.id, reg.name);
                    listWrapper.appendChild(div);
                });
                container.appendChild(listWrapper);
            } else {
                const cities = regionsData.filter(item => item.parent_id === parentId);
                const isAllSelected = cities.length > 0 && cities.every(c => selectedLocations.some(l => l.id === c.id && l.parentId === parentId));

                const selectAllRow = document.createElement('div');
                selectAllRow.className = `select-all-row ${isAllSelected ? 'selected' : ''}`;
                selectAllRow.innerHTML = `<span>Вся ${title}</span> <div class="checkbox"></div>`;
                selectAllRow.onclick = () => {
                    if (isAllSelected) selectedLocations = selectedLocations.filter(l => l.parentId !== parentId);
                    else {
                        selectedLocations = selectedLocations.filter(l => l.parentId !== parentId);
                        cities.forEach(c => selectedLocations.push({ id: c.id, name: c.name, parentId: parentId }));
                    }
                    renderList(parentId, title); 
                };
                container.appendChild(selectAllRow);

                const listWrapper = document.createElement('div');
                listWrapper.id = 'actual-list';
                cities.forEach(city => {
                    const isSelected = selectedLocations.some(l => l.id === city.id && l.parentId === parentId);
                    const div = document.createElement('div');
                    div.className = `list-item ${isSelected ? 'selected' : ''}`;
                    div.setAttribute('data-name', city.name.toLowerCase());
                    div.innerHTML = `<span style="flex: 1; padding: 10px 0;">${city.name}</span> <div class="checkbox"></div>`;
                    div.onclick = () => {
                        const exists = selectedLocations.some(l => l.id === city.id && l.parentId === parentId);
                        if (exists) selectedLocations = selectedLocations.filter(l => !(l.id === city.id && l.parentId === parentId));
                        else selectedLocations.push({ id: city.id, name: city.name, parentId: parentId });
                        renderList(parentId, title);
                    };
                    listWrapper.appendChild(div);
                });
                container.appendChild(listWrapper);
            }
        }

        function applyLocation() {
            const regionId = currentRenderParentId;
            if (regionId !== "0") {
                const cities = regionsData.filter(item => item.parent_id === regionId);
                const hasAny = cities.some(c => selectedLocations.some(l => l.id === c.id && l.parentId === regionId));
                if (!hasAny) cities.forEach(c => selectedLocations.push({ id: c.id, name: c.name, parentId: regionId }));
            }
            updateMainDisplay();
            showScreen('main-screen');
        }

        function updateMainDisplay() {
            const displayCat = document.getElementById('display-category');
            if (selectedCategory === null) displayCat.innerText = "📦 Выбрать категорию";
            else if (selectedCategory.id === 'all') displayCat.innerText = "📦 Все категории";
            else displayCat.innerText = `📦 ${selectedCategory.name}`;

            const displayLoc = document.getElementById('display-location');
            if (selectedLocations.length === 0) { displayLoc.innerText = "📍 Выбрать локацию"; return; }
            if (selectedLocations.length === 1 && selectedLocations[0].id === 'all') { displayLoc.innerText = "📍 Вся Беларусь"; return; }

            const uniqueRegionIds = [...new Set(selectedLocations.map(l => l.parentId))].filter(id => id);
            let selectedRegionsNames = [];
            uniqueRegionIds.forEach(pid => {
                const regionNode = regionsData.find(r => r.id === pid && r.parent_id === "0");
                if (regionNode) selectedRegionsNames.push(regionNode.name);
            });

            if (selectedRegionsNames.length === 1) displayLoc.innerText = `📍 ${selectedRegionsNames[0]}`;
            else if (selectedRegionsNames.length === 2) {
                let shortNames = selectedRegionsNames.map(name => name.replace(" область", "").replace("Минск", "Минск"));
                displayLoc.innerText = `📍 ${shortNames.join(", ")} обл.`;
            } else displayLoc.innerText = `📍 Выбрано локаций: ${selectedRegionsNames.length}`;
        }

        function flattenData(data, parentId = "0", path = "", visited = new Set()) {
            let result = [];
            data.filter(item => item.parent_id === parentId).forEach(item => {
                const uid = `${item.parent_id}_${item.id}_${item.name}`;
                if (visited.has(uid)) return;
                visited.add(uid);
                const currentPath = path ? `${path} > ${item.name}` : item.name;
                result.push({ ...item, path: currentPath, uniqueKey: uid });
                result = result.concat(flattenData(data, item.id, currentPath, visited));
            });
            return result;
        }

        function filterList() {
            const query = document.getElementById('list-search').value.toLowerCase().trim();
            const container = document.getElementById('list-container');
            if (!query) { renderList(currentRenderParentId, document.getElementById('list-title').innerText); return; }

            container.innerHTML = '';
            document.getElementById('apply-container').style.display = 'none';
            let searchScope = (currentListType === 'category') ? flattenData(categoriesData, currentRenderParentId) : flattenData(regionsData, currentRenderParentId);
            const results = searchScope.filter(item => item.name.toLowerCase().includes(query));

            if (results.length === 0) { container.innerHTML = '<div style="padding: 16px; color: gray;">Ничего не найдено</div>'; return; }

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'flex-start';
                div.innerHTML = `<div style="font-weight: bold;">${item.name}</div><div class="search-result-path">${item.path}</div>`;
                div.onclick = () => {
                    if (currentListType === 'category') selectLeafCategory(item.id, item.name, item.slug || "");
                    else {
                        if (item.parent_id === "0") {
                            const cities = regionsData.filter(r => r.parent_id === item.id);
                            selectedLocations = selectedLocations.filter(l => l.parentId !== item.id);
                            cities.forEach(c => selectedLocations.push({ id: c.id, name: c.name, parentId: item.id }));
                        } else {
                            if (!selectedLocations.some(l => l.id === item.id && l.parentId === item.parent_id)) selectedLocations.push({ id: item.id, name: item.name, parentId: item.parent_id });
                        }
                        updateMainDisplay();
                        showScreen('main-screen');
                    }
                };
                container.appendChild(div);
            });
        }

        function goInside(id, name) { historyStack.push({ id: id, name: name }); renderList(id, name); }
        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                renderList(prev.id, prev.name);
            } else showScreen('main-screen');
        }

        function sendData() {
            let locIds = [];
            if (!(selectedLocations.length === 1 && selectedLocations[0].id === 'all')) locIds = selectedLocations.map(l => l.id);

            const data = {
                query: document.getElementById('query').value || "",
                category_slug: (selectedCategory && selectedCategory.id !== 'all') ? selectedCategory.slug : "",
                category_name: (selectedCategory && selectedCategory.id !== 'all') ? selectedCategory.name : "Все категории",
                location_ids: locIds,
                location_display: document.getElementById('display-location').innerText.replace('📍 ', ''),
                price_min: Number(document.getElementById('price_min').value) || 0,
                price_max: Number(document.getElementById('price_max').value) || 0,
                is_free: filterState.isFree,
                is_negotiable: filterState.isNeg,
                condition: filterState.condition,
                seller: filterState.seller,
                sort: filterState.sort // Отправляем сортировку
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
