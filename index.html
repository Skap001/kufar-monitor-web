<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <title>Kufar Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --btn_blue: #2481cc; 
            --btn_text: #ffffff;
            --card_bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --border: var(--tg-theme-section-separator-color, #2f3b4a);
            --green: #34c759;
        }
        html, body { margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent; }
        .screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; box-sizing: border-box; }
        .screen.active { display: flex; }
        
        .main-content { padding: 16px; padding-bottom: 100px; flex: 1; overflow-y: auto; }
        h1 { font-size: 20px; margin: 0 0 16px 0; }
        
        .search-input { width: 100%; background-color: var(--card_bg); border: none; padding: 16px; border-radius: 12px; color: var(--text); font-size: 17px; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 18px; font-weight: 600; touch-action: manipulation; }
        .menu-item .main-text { color: var(--text); display: flex; align-items: center; gap: 10px; flex: 1; margin-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .menu-item .arrow-right { color: var(--hint); font-size: 24px; font-weight: 300; }
        
        .price-block { margin-top: 28px; }
        .price-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
        .price-inputs { display: flex; gap: 12px; width: 100%; margin-bottom: 16px; }
        .price-inputs input { flex: 1 1 0; min-width: 0; width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
        
        .quick-filters { display: flex; gap: 16px; margin-bottom: 24px; }
        .filter-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; }
        .filter-checkbox .box { width: 22px; height: 22px; border: 2px solid var(--hint); border-radius: 6px; display: flex; justify-content: center; align-items: center; box-sizing: border-box; background-color: transparent; }
        .filter-checkbox.selected .box { background-color: var(--btn_blue); border-color: var(--btn_blue); }
        .filter-checkbox .box::after { content: ''; display: none; width: 6px; height: 11px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .filter-checkbox.selected .box::after { display: block; }

        .filter-actions { display: flex; gap: 12px; align-items: stretch; margin-top: 10px; }
        .btn-filters { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; background-color: var(--card_bg); color: var(--text); border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        /* Синий счетчик фильтров */
        .badge { background-color: var(--btn_blue); color: white; border-radius: 50%; width: 22px; height: 22px; display: none; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        
        .btn-reset { width: 56px; display: flex; justify-content: center; align-items: center; background-color: var(--card_bg); color: var(--text); border: none; border-radius: 10px; cursor: pointer; }
        .btn-reset svg { width: 24px; height: 24px; fill: currentColor; }
        
        .bottom-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background-color: var(--bg); border-top: 1px solid var(--border); box-sizing: border-box; }
        .save-btn { width: 100%; padding: 16px; background-color: var(--btn_blue); color: var(--btn_text); border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .save-btn:disabled { background-color: #2f3b4a; color: #708499; cursor: not-allowed; opacity: 0.7; }
        
        .header { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
        .back-btn { font-size: 36px; font-weight: 900; line-height: 1; padding-right: 16px; color: var(--btn_blue); cursor: pointer; user-select: none; margin-top: -4px; }
        .list-title { font-size: 22px; font-weight: 700; margin: 0; }
        
        .list-search-wrapper { padding: 16px; }
        .list-search { width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
        
        .list-container { padding: 0 16px; overflow-y: auto; flex: 1; padding-bottom: 100px; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--border); font-size: 17px; cursor: pointer; touch-action: manipulation; outline: none; }
        .list-item:active { background-color: var(--card_bg); }
        .check-mark-only { display: none; color: var(--btn_blue); font-size: 24px; font-weight: bold; }
        .list-item.selected .check-mark-only { display: block; }
        .arrow { color: var(--hint); font-size: 28px; font-weight: 300; padding-left: 10px; user-select: none; margin-top: -4px;}
        
        .select-cat-btn { display: flex; align-items: center; gap: 12px; padding: 16px; background-color: var(--card_bg); border-radius: 10px; margin-bottom: 16px; font-weight: 600; cursor: pointer; color: var(--text); font-size: 17px; }
        .blue-square-check { width: 24px; height: 24px; background-color: var(--btn_blue); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; }
        .search-result-path { font-size: 13px; color: var(--hint); margin-top: 4px; }

        /* ЭКРАН ФИЛЬТРОВ */
        .filter-search-wrapper { padding: 16px; }
        .filter-search { width: 100%; background-color: var(--card_bg); border: none; padding: 16px; border-radius: 12px; color: var(--text); font-size: 17px; box-sizing: border-box; outline: none; }
        
        .filter-screen-content { padding: 0 16px 100px 16px; flex: 1; overflow-y: auto; }
        
        .accordion { margin-bottom: 12px; background-color: var(--card_bg); border-radius: 10px; overflow: hidden; }
        .accordion-header { padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .accordion-header::after { content: '▼'; font-size: 12px; color: var(--hint); transition: transform 0.2s; }
        .accordion.open .accordion-header::after { transform: rotate(180deg); }
        .accordion-content { display: none; padding: 0 16px 16px 16px; border-top: 1px solid var(--border); }
        .accordion.open .accordion-content { display: block; }

        .filter-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 16px; }
        .filter-row:last-child { border-bottom: none; }
        .filter-row .val { color: var(--hint); font-size: 15px; }
        
        .filter-toggle { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 16px; }
        .filter-toggle:last-child { border-bottom: none; }
        .filter-toggle .box { width: 22px; height: 22px; border: 2px solid var(--hint); border-radius: 6px; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        .filter-toggle.selected .box { background-color: var(--btn_blue); border-color: var(--btn_blue); }
        .filter-toggle .box::after { content: ''; display: none; width: 6px; height: 11px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px; }
        .filter-toggle.selected .box::after { display: block; }
    </style>
</head>
<body>
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="screen active">
        <div class="main-content">
            <h1>Новый поиск</h1>
            <input type="text" id="query" class="search-input" placeholder="🔍 Поиск по названию" oninput="updateMainDisplay()">
            
            <div class="menu-item" onclick="openList('category')">
                <div class="main-text" id="display-category">📦 Выбрать категорию</div>
                <div class="arrow-right">›</div>
            </div>
            
            <div class="menu-item" onclick="openList('location')">
                <div class="main-text" id="display-location">📍 Выбрать локацию</div>
                <div class="arrow-right">›</div>
            </div>
            
            <div class="price-block">
                <div class="price-title">Цена (BYN)</div>
                <div class="price-inputs">
                    <input type="number" id="price_min" placeholder="От" min="0" oninput="handlePriceInput()">
                    <input type="number" id="price_max" placeholder="До" min="0" oninput="handlePriceInput()">
                </div>
            </div>

            <div class="quick-filters">
                <div class="filter-checkbox" id="chk-free" onclick="toggleQuickFilter('free')">
                    <div class="box"></div> <span>Бесплатно</span>
                </div>
                <div class="filter-checkbox" id="chk-exchange" onclick="toggleQuickFilter('exchange')">
                    <div class="box"></div> <span>Возможен обмен</span>
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn-filters" onclick="showScreen('filters-screen')">
                    <span>⚙️ Выбрать фильтры</span>
                    <span id="filter-badge" class="badge">0</span>
                </button>
                <button class="btn-reset" onclick="resetAll()" title="Сбросить всё">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="bottom-btn">
            <button id="save-btn" class="save-btn" onclick="sendData()" disabled>Сохранить и начать</button>
        </div>
    </div>

    <!-- ЭКРАН СПИСКОВ -->
    <div id="list-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="goBack()">←</div>
            <h2 id="list-title" class="list-title">Выбор</h2>
        </div>
        <div class="list-search-wrapper">
            <input type="text" id="list-search" class="list-search" placeholder="Поиск..." oninput="filterList()">
        </div>
        <div class="list-container" id="list-container"></div>
    </div>

    <!-- ЭКРАН ФИЛЬТРОВ -->
    <div id="filters-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="showScreen('main-screen')">←</div>
            <h2 class="list-title">Все фильтры</h2>
        </div>
        <div class="filter-search-wrapper">
            <input type="text" id="filter-search" class="filter-search" placeholder="🔍 Найти фильтр" oninput="searchFilter()">
        </div>
        
        <!-- КОНТЕЙНЕР ДЛЯ РЕЗУЛЬТАТОВ ПОИСКА -->
        <div class="filter-screen-content" id="filter-search-results" style="display: none;"></div>

        <!-- ОСНОВНЫЕ АККОРДЕОНЫ -->
        <div class="filter-screen-content" id="filter-main-content">
            
            <div class="accordion open" id="acc-main">
                <div class="accordion-header" onclick="toggleAccordion('acc-main')">Основные фильтры</div>
                <div class="accordion-content">
                    
                    <div class="filter-toggle" id="tg-photo" onclick="toggleFilter('only_photo', 'tg-photo')">
                        <span>Только с фото</span> <div class="box"></div>
                    </div>
                    <div class="filter-toggle" id="tg-video" onclick="toggleFilter('only_video', 'tg-video')">
                        <span>Только с видео</span> <div class="box"></div>
                    </div>
                    
                    <div class="filter-row" onclick="openFilterOption('condition')">
                        <span>Состояние</span> <span class="val" id="val-condition">Не важно</span>
                    </div>
                    <div class="filter-row" onclick="openFilterOption('seller')">
                        <span>Продавец</span> <span class="val" id="val-seller">Не важно</span>
                    </div>
                    <div class="filter-row" onclick="openFilterOption('sort')">
                        <span>Сортировка</span> <span class="val" id="val-sort">Актуальные</span>
                    </div>

                </div>
            </div>

            <div class="accordion" id="acc-other">
                <div class="accordion-header" onclick="toggleAccordion('acc-other')">Другие фильтры</div>
                <div class="accordion-content">
                    <div class="filter-toggle" id="tg-dle" onclick="toggleFilter('kufar_delivery', 'tg-dle')">
                        <span>Куфар Доставка</span> <div class="box"></div>
                    </div>
                    <div class="filter-toggle" id="tg-sde" onclick="toggleFilter('kufar_payment', 'tg-sde')">
                        <span>Куфар Оплата</span> <div class="box"></div>
                    </div>
                    <div class="filter-toggle" id="tg-inst" onclick="toggleFilter('kufar_installment', 'tg-inst')">
                        <span>Куфар Рассрочка</span> <div class="box"></div>
                    </div>
                </div>
            </div>

        </div>
        <div class="bottom-btn">
            <button class="save-btn" onclick="applyFilters()">Применить</button>
        </div>
    </div>

    <!-- ЭКРАН ОПЦИЙ -->
    <div id="option-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="showScreen('filters-screen')">←</div>
            <h2 id="option-title" class="list-title">Выбор</h2>
        </div>
        <div class="list-container" id="option-list"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('secondary_bg_color');

        let selectedCategory = null; 
        let selectedLocations = []; 
        let categoriesData = [];
        let regionsData = [];
        let currentListType = "";
        let historyStack = []; 
        let currentRenderParentId = "0";
        let isLocSelected = false;
        let currentEditId = null;

        let filterState = { 
            isFree: false, 
            condition: "", seller: "", sort: "lst.d", search_desc: false,
            only_photo: false, only_video: false, exchange: false,
            kufar_delivery: false, kufar_payment: false, kufar_installment: false
        };

        let currentOptionType = "";

        // Список всех фильтров для умного поиска
        const allFilters = [
            { id: 'only_photo', name: 'Только с фото', type: 'toggle' },
            { id: 'only_video', name: 'Только с видео', type: 'toggle' },
            { id: 'exchange', name: 'Возможен обмен', type: 'toggle' },
            { id: 'condition', name: 'Состояние', type: 'option' },
            { id: 'seller', name: 'Продавец', type: 'option' },
            { id: 'sort', name: 'Сортировка', type: 'option' },
            { id: 'kufar_delivery', name: 'Куфар Доставка', type: 'toggle' },
            { id: 'kufar_payment', name: 'Куфар Оплата', type: 'toggle' },
            { id: 'kufar_installment', name: 'Куфар Рассрочка', type: 'toggle' }
        ];

        fetch('categories.json').then(r => r.json()).then(data => {
            categoriesData = data;
            return fetch('regions.json').then(r => r.json());
        }).then(rdata => {
            regionsData = rdata;
            loadStateFromUrl();
            updateMainDisplay();
        });

        function loadStateFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit_id');
            const stateBase64 = urlParams.get('state');
            const isNew = urlParams.get('new');

            if (isNew) {
                currentEditId = null; 
                resetAll(); 
                localStorage.removeItem('kufar_draft'); 
            } else if (editId && stateBase64) {
                currentEditId = parseInt(editId);
                try {
                    const binary = atob(stateBase64.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const jsonString = new TextDecoder().decode(bytes);
                    const data = JSON.parse(jsonString);
                    
                    document.getElementById('query').value = data.query || "";
                    document.getElementById('price_min').value = data.price_min || "";
                    document.getElementById('price_max').value = data.price_max || "";
                    
                    if (data.category_slug) {
                        selectedCategory = { slug: data.category_slug, name: data.category_name || "Категория" };
                    }
                    
                    if (data.isLocSelected || data.location_slug) {
                        isLocSelected = true; 
                        if (data.location_slug) {
                            const rNode = regionsData.find(r => r.slug === data.location_slug);
                            if (rNode) {
                                selectedLocations = [{ 
                                    id: rNode.id, name: rNode.name, slug: rNode.slug, 
                                    isRegion: data.is_region, parentId: rNode.parent_id 
                                }];
                            }
                        }
                    }

                    filterState = {
                        isFree: data.is_free || false,
                        condition: data.condition || "",
                        seller: data.seller || "",
                        sort: data.sort || "lst.d",
                        search_desc: data.search_desc || false,
                        only_photo: data.only_photo || false,
                        only_video: data.only_video || false,
                        exchange: data.exchange || false,
                        kufar_delivery: data.kufar_delivery || false,
                        kufar_payment: data.kufar_payment || false,
                        kufar_installment: data.kufar_installment || false
                    };
                    
                    if (filterState.isFree) document.getElementById('chk-free').classList.add('selected');
                    if (filterState.exchange) document.getElementById('chk-exchange').classList.add('selected');
                    if (filterState.only_photo) document.getElementById('tg-photo').classList.add('selected');
                    if (filterState.only_video) document.getElementById('tg-video').classList.add('selected');
                    if (filterState.kufar_delivery) document.getElementById('tg-dle').classList.add('selected');
                    if (filterState.kufar_payment) document.getElementById('tg-sde').classList.add('selected');
                    if (filterState.kufar_installment) document.getElementById('tg-inst').classList.add('selected');

                    updateFilterBadge();
                    updateFilterTexts();
                } catch (e) {
                    console.error("Ошибка загрузки состояния для редактирования", e);
                }
            } else {
                restoreDraft();
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function updateMainDisplay() {
            const displayCat = document.getElementById('display-category');
            const saveBtn = document.getElementById('save-btn');
            const queryText = document.getElementById('query').value.trim();

            if ((selectedCategory === null || selectedCategory.id === 'all') && !queryText) {
                displayCat.innerText = "📦 Выбрать категорию";
                saveBtn.disabled = true;
            } else {
                displayCat.innerText = (selectedCategory && selectedCategory.id !== 'all') ? `📦 ${selectedCategory.name}` : "📦 Все категории";
                saveBtn.disabled = false;
            }

            const displayLoc = document.getElementById('display-location');
            if (!isLocSelected) {
                displayLoc.innerText = "📍 Выбрать локацию";
                return;
            }
            if (selectedLocations.length === 0) { 
                displayLoc.innerText = "📍 Вся Беларусь";
                return; 
            }
            const loc = selectedLocations[0];
            if (loc.isRegion) {
                displayLoc.innerText = `📍 ${loc.name}`;
            } else {
                const regionNode = regionsData.find(r => r.id === loc.parentId && r.parent_id === "0");
                displayLoc.innerText = regionNode ? `📍 ${regionNode.name}, ${loc.name}` : `📍 ${loc.name}`;
            }
        }

        // --- ЛОГИКА БЕСПЛАТНО И ЦЕНЫ ---
        function handlePriceInput() {
            const minVal = parseFloat(document.getElementById('price_min').value) || 0;
            const maxVal = parseFloat(document.getElementById('price_max').value) || 0;
            
            if (minVal > 0 || maxVal > 0) {
                if (filterState.isFree) {
                    filterState.isFree = false;
                    document.getElementById('chk-free').classList.remove('selected');
                    updateFilterBadge();
                }
            }
            saveDraft();
        }

        function toggleQuickFilter(type) {
            if (type === 'free') {
                filterState.isFree = !filterState.isFree;
                if (filterState.isFree) {
                    document.getElementById('price_min').value = '';
                    document.getElementById('price_max').value = '';
                }
                document.getElementById('chk-free').classList.toggle('selected', filterState.isFree);
            } else if (type === 'exchange') {
                filterState.exchange = !filterState.exchange;
                document.getElementById('chk-exchange').classList.toggle('selected', filterState.exchange);
            }
            updateFilterBadge();
            saveDraft();
        }

        // --- СЧЕТЧИК ФИЛЬТРОВ ---
        function updateFilterBadge() {
            let count = 0;
            if (filterState.isFree) count++;
            if (filterState.exchange) count++;
            if (filterState.only_photo) count++;
            if (filterState.only_video) count++;
            if (filterState.kufar_delivery) count++;
            if (filterState.kufar_payment) count++;
            if (filterState.kufar_installment) count++;
            if (filterState.condition) count++;
            if (filterState.seller) count++;
            if (filterState.sort !== 'lst.d') count++;

            const badge = document.getElementById('filter-badge');
            if (count > 0) {
                badge.style.display = 'flex';
                badge.innerText = count;
            } else {
                badge.style.display = 'none';
            }
        }

        // --- ЛОГИКА ФИЛЬТРОВ ---
        function toggleAccordion(id) {
            document.getElementById(id).classList.toggle('open');
        }

        function toggleFilter(key, elemId) {
            filterState[key] = !filterState[key];
            document.getElementById(elemId).classList.toggle('selected', filterState[key]);
            updateFilterBadge();
            saveDraft();
        }

        function openFilterOption(type) {
            currentOptionType = type;
            showScreen('option-screen');
            const container = document.getElementById('option-list');
            container.innerHTML = '';
            
            let title = "";
            let options = [];

            if (type === 'condition') {
                title = "Состояние";
                options = [{v: "", t: "Не важно"}, {v: "new", t: "Новое"}, {v: "used", t: "Б/у"}];
            } else if (type === 'seller') {
                title = "Продавец";
                options = [{v: "", t: "Не важно"}, {v: "private", t: "Частное лицо"}, {v: "company", t: "Компания"}];
            } else if (type === 'sort') {
                title = "Сортировка";
                options = [{v: "lst.d", t: "Актуальные (Сначала новые)"}, {v: "prc.a", t: "Сначала дешевле"}, {v: "prc.d", t: "Сначала дороже"}];
            }

            document.getElementById('option-title').innerText = title;

            options.forEach(opt => {
                const isSel = (filterState[currentOptionType] === opt.v);
                const div = document.createElement('div');
                div.className = `list-item ${isSel ? 'selected' : ''}`;
                div.innerHTML = `<span>${opt.t}</span> <span class="check-mark-only">✓</span>`;
                div.onclick = () => {
                    filterState[currentOptionType] = opt.v;
                    updateFilterTexts();
                    updateFilterBadge();
                    saveDraft();
                    showScreen('filters-screen');
                };
                container.appendChild(div);
            });
        }

        function updateFilterTexts() {
            document.getElementById('val-condition').innerText = 
                filterState.condition === 'new' ? 'Новое' : filterState.condition === 'used' ? 'Б/у' : 'Не важно';
            document.getElementById('val-seller').innerText = 
                filterState.seller === 'private' ? 'Частное лицо' : filterState.seller === 'company' ? 'Компания' : 'Не важно';
            document.getElementById('val-sort').innerText = 
                filterState.sort === 'prc.a' ? 'Сначала дешевле' : filterState.sort === 'prc.d' ? 'Сначала дороже' : 'Актуальные';
        }

        function applyFilters() {
            updateFilterTexts();
            showScreen('main-screen');
        }

        // --- УМНЫЙ ПОИСК ПО ФИЛЬТРАМ ---
        function searchFilter() {
            const query = document.getElementById('filter-search').value.toLowerCase().trim();
            const mainContent = document.getElementById('filter-main-content');
            const resultsContainer = document.getElementById('filter-search-results');

            if (!query) {
                mainContent.style.display = 'block';
                resultsContainer.style.display = 'none';
                return;
            }

            mainContent.style.display = 'none';
            resultsContainer.style.display = 'block';
            resultsContainer.innerHTML = '';

            const matched = allFilters.filter(f => f.name.toLowerCase().includes(query));

            if (matched.length === 0) {
                resultsContainer.innerHTML = '<div style="padding: 16px; color: gray;">Ничего не найдено</div>';
                return;
            }

            matched.forEach(f => {
                const isChecked = filterState[f.id];
                const div = document.createElement('div');
                
                if (f.type === 'toggle') {
                    div.className = `filter-toggle ${isChecked ? 'selected' : ''}`;
                    div.innerHTML = `<span>${f.name}</span> <div class="box"></div>`;
                    div.onclick = () => {
                        filterState[f.id] = !filterState[f.id];
                        div.classList.toggle('selected', filterState[f.id]);
                        updateFilterBadge();
                    };
                } else {
                    let valText = "Не важно";
                    if (f.id === 'condition') valText = filterState.condition === 'new' ? 'Новое' : filterState.condition === 'used' ? 'Б/у' : 'Не важно';
                    if (f.id === 'seller') valText = filterState.seller === 'private' ? 'Частное лицо' : filterState.seller === 'company' ? 'Компания' : 'Не важно';
                    if (f.id === 'sort') valText = filterState.sort === 'prc.a' ? 'Сначала дешевле' : filterState.sort === 'prc.d' ? 'Сначала дороже' : 'Актуальные';
                    
                    div.className = `filter-row`;
                    div.innerHTML = `<span>${f.name}</span> <span class="val">${valText}</span>`;
                    div.onclick = () => {
                        document.getElementById('filter-search').value = ''; // Сброс поиска
                        searchFilter(); // Вернуть аккордеоны
                        openFilterOption(f.id);
                    };
                }
                resultsContainer.appendChild(div);
            });
        }

        // --- ОСТАЛЬНОЙ КОД (КАТЕГОРИИ, ЛОКАЦИИ, ОТПРАВКА) ---
        function openList(type) {
            currentListType = type;
            historyStack = [{ id: "0", name: type === 'category' ? "Категории" : "Локация" }];
            document.getElementById('list-search').value = '';
            renderList("0", type === 'category' ? "Категории" : "Локация");
            showScreen('list-screen');
        }

        function renderList(parentId, title) {
            currentRenderParentId = parentId;
            document.getElementById('list-title').innerText = title;
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            if (currentListType === 'category') renderCategoryList(parentId, title);
            else renderLocationList(parentId, title);
        }

        function renderCategoryList(parentId, title) {
            const container = document.getElementById('list-container');
            if (parentId !== "0") {
                const selectCurrent = document.createElement('div');
                selectCurrent.className = 'select-cat-btn';
                selectCurrent.innerHTML = `<div class="blue-square-check">✓</div> <span>Выбрать: ${title}</span>`;
                selectCurrent.onclick = () => {
                    const node = categoriesData.find(i => i.id === parentId && i.name === title);
                    if (node) { selectedCategory = { id: node.id, name: node.name, slug: node.slug }; updateMainDisplay(); showScreen('main-screen'); }
                };
                container.appendChild(selectCurrent);
            }

            const listWrapper = document.createElement('div');
            listWrapper.id = 'actual-list';
            categoriesData.filter(item => item.parent_id === parentId).forEach(item => {
                if (item.id === "1000" || item.id === "25000") return; // Скрываем Недвижимость и Путешествия
                const hasChildren = categoriesData.some(child => child.parent_id === item.id);
                const isSelected = (selectedCategory && selectedCategory.id === item.id && selectedCategory.name === item.name);
                const div = document.createElement('div');
                div.className = `list-item ${isSelected ? 'selected' : ''}`;
                div.setAttribute('data-name', item.name.toLowerCase());
                div.innerHTML = `
                    <span style="flex: 1; padding: 10px 0;" onclick="event.stopPropagation(); ${hasChildren ? `goInside('${item.id}', '${item.name}')` : `selectLeafCategory('${item.id}', '${item.name}', '${item.slug}')`}">${item.name}</span>
                    ${hasChildren ? `<span class="arrow" onclick="event.stopPropagation(); goInside('${item.id}', '${item.name}')">›</span>` : `<span class="check-mark-only">✓</span>`}
                `;
                div.onclick = () => { if (hasChildren) goInside(item.id, item.name); else selectLeafCategory(item.id, item.name, item.slug); };
                listWrapper.appendChild(div);
            });
            container.appendChild(listWrapper);
        }

        function selectLeafCategory(id, name, slug) {
            selectedCategory = { id: id, name: name, slug: slug };
            updateMainDisplay();
            saveDraft();
            showScreen('main-screen');
        }

        function renderLocationList(parentId, title) {
            const container = document.getElementById('list-container');
            if (parentId === "0") {
                const listWrapper = document.createElement('div');
                listWrapper.id = 'actual-list';
                const allItem = document.createElement('div');
                allItem.className = `list-item ${selectedLocations.length === 0 ? 'selected' : ''}`;
                allItem.innerHTML = `<span>Вся Беларусь</span> <span class="check-mark-only">✓</span>`;
                allItem.onclick = () => { 
                    selectedLocations = []; 
                    isLocSelected = true; 
                    updateMainDisplay(); 
                    saveDraft(); 
                    showScreen('main-screen'); 
                };
                listWrapper.appendChild(allItem);

                regionsData.filter(item => item.parent_id === "0").forEach(reg => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.setAttribute('data-name', reg.name.toLowerCase());
                    div.innerHTML = `<span style="flex:1; padding:10px 0;">${reg.name}</span> <span class="arrow">›</span>`;
                    div.onclick = () => goInside(reg.id, reg.name);
                    listWrapper.appendChild(div);
                });
                container.appendChild(listWrapper);
            } else {
                const cities = regionsData.filter(item => item.parent_id === parentId);
                const isRegionSelected = (selectedLocations.length === 1 && selectedLocations[0].isRegion === true && selectedLocations[0].id === parentId);
                const prefix = title === "Минск" ? "Весь" : "Вся";
                
                const selectAllRow = document.createElement('div');
                selectAllRow.className = `list-item ${isRegionSelected ? 'selected' : ''}`;
                selectAllRow.innerHTML = `<span>${prefix} ${title}</span> <span class="check-mark-only">✓</span>`;
                selectAllRow.onclick = () => {
                    const regionNode = regionsData.find(r => r.id === parentId && r.parent_id === "0");
                    selectedLocations = [{ id: parentId, name: title, isRegion: true, slug: regionNode ? regionNode.slug : "" }];
                    isLocSelected = true;
                    updateMainDisplay();
                    saveDraft();
                    showScreen('main-screen');
                };
                container.appendChild(selectAllRow);

                const listWrapper = document.createElement('div');
                listWrapper.id = 'actual-list';
                cities.forEach(city => {
                    const isSelected = (selectedLocations.length === 1 && selectedLocations[0].isRegion !== true && selectedLocations[0].id === city.id && selectedLocations[0].parentId === parentId);
                    const div = document.createElement('div');
                    div.className = `list-item ${isSelected ? 'selected' : ''}`;
                    div.setAttribute('data-name', city.name.toLowerCase());
                    div.innerHTML = `<span style="flex: 1; padding: 10px 0;">${city.name}</span> <span class="check-mark-only">✓</span>`;
                    div.onclick = () => {
                        selectedLocations = [{ id: city.id, name: city.name, parentId: parentId, slug: city.slug }];
                        isLocSelected = true;
                        updateMainDisplay();
                        saveDraft();
                        showScreen('main-screen');
                    };
                    listWrapper.appendChild(div);
                });
                container.appendChild(listWrapper);
            }
        }

        function flattenData(data, parentId = "0", path = "", visited = new Set()) {
            let result = [];
            data.filter(item => item.parent_id === parentId).forEach(item => {
                if (item.id === "1000" || item.id === "25000") return; // Скрываем в поиске
                const uid = `${item.parent_id}_${item.id}_${item.name}`;
                if (visited.has(uid)) return;
                visited.add(uid);
                const currentPath = path ? `${path} > ${item.name}` : item.name;
                result.push({ ...item, path: currentPath, uniqueKey: uid });
                result = result.concat(flattenData(data, item.id, currentPath, visited));
            });
            return result;
        }

        function filterList() {
            const query = document.getElementById('list-search').value.toLowerCase().trim();
            const container = document.getElementById('list-container');
            if (!query) { renderList(currentRenderParentId, document.getElementById('list-title').innerText); return; }

            container.innerHTML = '';
            let searchScope = (currentListType === 'category') ? flattenData(categoriesData, currentRenderParentId) : flattenData(regionsData, currentRenderParentId);
            const results = searchScope.filter(item => item.name.toLowerCase().includes(query));

            if (results.length === 0) { container.innerHTML = '<div style="padding: 16px; color: gray;">Ничего не найдено</div>'; return; }

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.style.flexDirection = 'column';
                div.style.alignItems = 'flex-start';
                div.innerHTML = `<div style="font-weight: bold;">${item.name}</div><div class="search-result-path">${item.path}</div>`;
                div.onclick = () => {
                    if (currentListType === 'category') selectLeafCategory(item.id, item.name, item.slug || "");
                    else {
                        if (item.parent_id === "0") selectedLocations = [{ id: item.id, name: item.name, isRegion: true, slug: item.slug }];
                        else selectedLocations = [{ id: item.id, name: item.name, parentId: item.parent_id, slug: item.slug }];
                        isLocSelected = true; 
                        updateMainDisplay();
                        saveDraft(); 
                        showScreen('main-screen');
                    }
                };
                container.appendChild(div);
            });
        }

        function goInside(id, name) { historyStack.push({ id: id, name: name }); renderList(id, name); }
        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                renderList(prev.id, prev.name);
            } else showScreen('main-screen');
        }

        function saveDraft() {
            const state = {
                query: document.getElementById('query').value,
                price_min: Number(document.getElementById('price_min').value) || 0,
                price_max: Number(document.getElementById('price_max').value) || 0,
                category_slug: selectedCategory ? selectedCategory.slug : "",
                category_name: selectedCategory ? selectedCategory.name : "",
                location_slug: selectedLocations.length > 0 ? selectedLocations[0].slug : "",
                is_region: selectedLocations.length > 0 ? !!selectedLocations[0].isRegion : false,
                is_free: filterState.isFree,
                condition: filterState.condition,
                seller: filterState.seller,
                sort: filterState.sort,
                search_desc: filterState.search_desc,
                only_photo: filterState.only_photo,
                only_video: filterState.only_video,
                exchange: filterState.exchange,
                kufar_delivery: filterState.kufar_delivery,
                kufar_payment: filterState.kufar_payment,
                kufar_installment: filterState.kufar_installment
            };
            localStorage.setItem('kufar_draft', JSON.stringify(state));
        }

        function restoreDraft() {
            const draftRaw = localStorage.getItem('kufar_draft');
            if (!draftRaw) return;
            try {
                const data = JSON.parse(draftRaw);
                if (data.query) document.getElementById('query').value = data.query;
                if (data.price_min) document.getElementById('price_min').value = data.price_min;
                if (data.price_max) document.getElementById('price_max').value = data.price_max;
                if (data.category_slug) selectedCategory = { slug: data.category_slug, name: data.category_name || "" };
                if (data.location_slug) {
                    const rNode = regionsData.find(r => r.slug === data.location_slug);
                    if (rNode) selectedLocations = [{ id: rNode.id, name: rNode.name, slug: rNode.slug, isRegion: data.is_region, parentId: rNode.parent_id }];
                }
                Object.assign(filterState, {
                    isFree: data.is_free || false,
                    condition: data.condition || "",
                    seller: data.seller || "",
                    sort: data.sort || "lst.d",
                    search_desc: data.search_desc || false,
                    only_photo: data.only_photo || false,
                    only_video: data.only_video || false,
                    exchange: data.exchange || false,
                    kufar_delivery: data.kufar_delivery || false,
                    kufar_payment: data.kufar_payment || false,
                    kufar_installment: data.kufar_installment || false
                });
                if (filterState.isFree) document.getElementById('chk-free').classList.add('selected');
                if (filterState.exchange) document.getElementById('chk-exchange').classList.add('selected');
                updateFilterBadge();
                updateFilterTexts();
            } catch (e) {}
        }

        function sendData() {
            if (!selectedCategory && !document.getElementById('query').value.trim()) return;

            let locIds = [];
            let locSlug = "";
            let locName = "";
            let isRegion = false;

            if (selectedLocations.length === 1) {
                const loc = selectedLocations[0];
                locName = loc.name;
                locSlug = loc.slug;
                
                if (loc.slug === 'drugie-goroda' && loc.parentId) {
                    const parentRegionNode = regionsData.find(r => r.id === loc.parentId && r.parent_id === "0");
                    if (parentRegionNode) {
                        const regionMap = {
                            "brestskaja-oblast": "brestskaya-obl",
                            "gomel-skaja-oblast": "gomelskaya-obl",
                            "grodnenskaja-oblast": "grodnenskaya-obl",
                            "mogilevskaja-oblast": "mogilevskaya-obl",
                            "minskaja-oblast": "minskaya-obl",
                            "vitebskaja-oblast": "vitebskaya-obl"
                        };
                        const mapped = regionMap[parentRegionNode.slug] || parentRegionNode.slug;
                        locSlug = mapped + "-drugie";
                        locName = parentRegionNode.name + ", " + loc.name;
                    }
                } else if (loc.isRegion) {
                    isRegion = true;
                    locIds = regionsData.filter(r => r.parent_id === loc.id).map(c => c.id);
                } else {
                    locIds = [loc.id];
                }
            }

            const data = {
                edit_id: currentEditId, // <--- ДОБАВЛЕНО ДЛЯ СОХРАНЕНИЯ ИЗМЕНЕНИЙ
                query: document.getElementById('query').value || "",
                category_slug: (selectedCategory && selectedCategory.id !== 'all') ? selectedCategory.slug : "",
                category_name: (selectedCategory && selectedCategory.id !== 'all') ? selectedCategory.name : "Все категории",
                location_ids: locIds,
                location_slug: locSlug,
                location_name: locName,
                is_region: isRegion,
                isLocSelected: isLocSelected,
                location_display: isLocSelected ? document.getElementById('display-location').innerText.replace('📍 ', '') : "Вся Беларусь",
                price_min: Number(document.getElementById('price_min').value) || 0,
                price_max: Number(document.getElementById('price_max').value) || 0,
                is_free: filterState.isFree,
                condition: filterState.condition,
                seller: filterState.seller,
                sort: filterState.sort,
                search_desc: filterState.search_desc,
                only_photo: filterState.only_photo,
                only_video: filterState.only_video,
                exchange: filterState.exchange,
                kufar_delivery: filterState.kufar_delivery,
                kufar_payment: filterState.kufar_payment,
                kufar_installment: filterState.kufar_installment
            };
            // Отправляем данные и показываем ошибку, если что-то не так
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify(data));
                setTimeout(() => window.Telegram.WebApp.close(), 200);
            } else {
                alert("Ошибка: Это окно открыто не через Telegram!");
            }
        }

        function resetAll() {
            currentEditId = null;
            document.getElementById('query').value = '';
            document.getElementById('price_min').value = '';
            document.getElementById('price_max').value = '';
            selectedCategory = null;
            selectedLocations = [];
            isLocSelected = false;
            filterState = { 
                isFree: false, condition: "", seller: "", sort: "lst.d", search_desc: false,
                only_photo: false, only_video: false, exchange: false, kufar_delivery: false, kufar_payment: false, kufar_installment: false
            };
            document.getElementById('chk-free').classList.remove('selected');
            document.getElementById('chk-exchange').classList.remove('selected');
            document.querySelectorAll('.filter-toggle').forEach(el => el.classList.remove('selected'));
            updateFilterBadge();
            updateFilterTexts();
            localStorage.removeItem('kufar_draft');
            updateMainDisplay();
            showScreen('main-screen');
        }
    </script>
</body>
