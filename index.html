<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kufar Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn_text: var(--tg-theme-button-text-color, #ffffff);
            --card_bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px; /* Место для нижней кнопки */
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        h1 { font-size: 20px; margin-top: 0; margin-bottom: 20px; }

        .section { margin-bottom: 24px; }
        .section-title { font-size: 13px; color: var(--hint); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .card {
            background-color: var(--card_bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .card span { color: var(--text); }
        .card span.value { color: var(--hint); }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
        .chip {
            background-color: var(--card_bg);
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .chip.active { border-color: var(--btn); color: var(--btn); background-color: rgba(36, 129, 204, 0.1); }

        .price-inputs { display: flex; gap: 10px; }
        .price-inputs input {
            flex: 1; background-color: var(--card_bg); border: none; padding: 14px;
            border-radius: 12px; color: var(--text); font-size: 16px; outline: none;
        }
        .price-inputs input::placeholder { color: var(--hint); }

        .bottom-btn {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 16px; background-color: var(--bg);
            box-sizing: border-box;
        }
        
        .save-btn {
            width: 100%; padding: 16px; background-color: var(--btn);
            color: var(--btn_text); border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .save-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>Новый поиск</h1>

    <!-- Категории -->
    <div class="section">
        <div class="section-title">Категория</div>
        <div class="chips" id="category-chips">
            <div class="chip active" data-val="sneakers">Кроссовки</div>
            <div class="chip" data-val="phones">Телефоны</div>
            <div class="chip" data-val="auto">Авто</div>
            <div class="chip" data-val="realty">Недвижимость</div>
        </div>
    </div>

    <!-- Локация -->
    <div class="section">
        <div class="section-title">Локация</div>
        <div class="chips" id="city-chips">
            <div class="chip active" data-val="all">Вся Беларусь</div>
            <div class="chip" data-val="minsk">Минск</div>
            <div class="chip" data-val="brest">Брест</div>
            <div class="chip" data-val="grodno">Гродно</div>
        </div>
    </div>

    <!-- Цена -->
    <div class="section">
        <div class="section-title">Цена (BYN)</div>
        <div class="price-inputs">
            <input type="number" id="price_min" placeholder="От" min="0">
            <input type="number" id="price_max" placeholder="До" min="0">
        </div>
    </div>

    <!-- Кнопка сохранения -->
    <div class="bottom-btn">
        <button class="save-btn" onclick="sendData()">Сохранить и начать</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открыть на весь экран
        tg.BackButton.hide(); // Скрыть кнопку "Назад" из шапки

        // Логика переключения чипсов (кнопок)
        let selectedCategory = "sneakers";
        let selectedCity = "all";

        document.querySelectorAll('#category-chips .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('#category-chips .chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                selectedCategory = chip.getAttribute('data-val');
            });
        });

        document.querySelectorAll('#city-chips .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('#city-chips .chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                selectedCity = chip.getAttribute('data-val');
            });
        });

        function sendData() {
            const priceMin = document.getElementById('price_min').value || 0;
            const priceMax = document.getElementById('price_max').value || 0;
            
            const data = {
                category: selectedCategory,
                city: selectedCity,
                price_min: Number(priceMin),
                price_max: Number(priceMax)
            };
            
            // Отправляем JSON в бота
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
