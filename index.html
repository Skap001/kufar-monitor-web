<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kufar Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn_text: var(--tg-theme-button-text-color, #ffffff);
            --card_bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --border: var(--tg-theme-section-separator-color, #2f3b4a);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .screen { display: none; flex-direction: column; height: 100vh; }
        .screen.active { display: flex; }
        .main-content { padding: 16px; padding-bottom: 90px; flex: 1; overflow-y: auto; }
        h1 { font-size: 20px; margin: 0 0 16px 0; }
        .search-input { width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
        .menu-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 16px; }
        .menu-item .value { color: var(--hint); text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .price-block { margin-top: 24px; }
        .price-inputs { display: flex; gap: 12px; }
        .price-inputs input { flex: 1; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; }
        .bottom-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background-color: var(--bg); border-top: 1px solid var(--border); }
        .save-btn { width: 100%; padding: 16px; background-color: var(--btn); color: var(--btn_text); border: none; border-radius: 10px; font-size: 16px; font-weight: 600; }
        .header { display: flex; align-items: center; padding: 16px; }
        .back-btn { font-size: 24px; padding-right: 16px; color: var(--btn); cursor: pointer; }
        .list-container { padding: 0 16px; overflow-y: auto; flex: 1; }
        .list-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 16px; cursor: pointer; align-items: center; }
        .list-item:active { opacity: 0.7; }
        .check-mark { display: none; color: var(--btn); font-weight: bold; font-size: 18px; }
        .list-item.selected .check-mark { display: block; }
        .arrow { color: var(--hint); font-size: 14px; }
        .select-current { color: var(--btn); font-weight: bold; border-bottom: 2px solid var(--btn); }
    </style>
</head>
<body>
    <div id="main-screen" class="screen active">
        <div class="main-content">
            <h1>Новый поиск</h1>
            <input type="text" id="query" class="search-input" placeholder="🔍 Что вы ищете?">
            <div class="menu-item" onclick="openCategoryScreen()">
                <div class="label">📦 Категория</div>
                <div class="value"><span id="current-category">Все категории</span> ›</div>
            </div>
            <div class="menu-item" onclick="openLocationScreen()">
                <div class="label">📍 Локация</div>
                <div class="value"><span id="current-location">Вся Беларусь</span> ›</div>
            </div>
            <div class="price-block">
                <div class="price-title">Цена (BYN)</div>
                <div class="price-inputs">
                    <input type="number" id="price_min" placeholder="От">
                    <input type="number" id="price_max" placeholder="До">
                </div>
            </div>
        </div>
        <div class="bottom-btn"><button class="save-btn" onclick="sendData()">Сохранить и начать</button></div>
    </div>

    <div id="list-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="goBack()">←</div>
            <h2 id="list-title">Выбор</h2>
        </div>
        <div class="list-container" id="list-container"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let selectedCategory = { id: "all", name: "Все категории", slug: "" };
        let selectedCity = { id: "all", name: "Вся Беларусь" };
        
        let categoriesData = [];
        let regionsData = [];
        let currentListType = "";
        let historyStack = []; 

        fetch('categories.json').then(r => r.json()).then(data => categoriesData = data);
        fetch('regions.json').then(r => r.json()).then(data => regionsData = data);

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openCategoryScreen() {
            currentListType = "category";
            historyStack = [{ id: "0", name: "Категории" }];
            renderList("0", "Категории");
            showScreen('list-screen');
        }

        function openLocationScreen() {
            currentListType = "location";
            historyStack = [{ id: "0", name: "Локация" }];
            renderList("0", "Локация");
            showScreen('list-screen');
        }

        function renderList(parentId, title) {
            document.getElementById('list-title').innerText = title;
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            const data = currentListType === 'category' ? categoriesData : regionsData;

            // Если мы не в самом начале, показываем кнопку "Выбрать [Название]"
            if (parentId !== "0") {
                const currentNode = data.find(i => i.id === parentId);
                if (currentNode) {
                    const selectCurrent = document.createElement('div');
                    selectCurrent.className = 'list-item select-current';
                    selectCurrent.innerHTML = `✅ Выбрать: ${currentNode.name} <span class="check-mark" style="display:block; color:var(--btn);">✓</span>`;
                    selectCurrent.onclick = () => {
                        if (currentListType === 'category') {
                            selectedCategory = { id: currentNode.id, name: currentNode.name, slug: currentNode.slug };
                            document.getElementById('current-category').innerText = currentNode.name;
                        } else {
                            selectedCity = { id: currentNode.id, name: currentNode.name };
                            document.getElementById('current-location').innerText = currentNode.name;
                        }
                        showScreen('main-screen');
                    };
                    container.appendChild(selectCurrent);
                }
            } else {
                // На самом верхнем уровне "Все категории" / "Вся Беларусь"
                const allItem = document.createElement('div');
                allItem.className = 'list-item';
                allItem.innerHTML = `${currentListType === 'category' ? 'Все категории' : 'Вся Беларусь'} <span class="check-mark" style="display:block; color:var(--btn);">✓</span>`;
                allItem.onclick = () => {
                    if (currentListType === 'category') {
                        selectedCategory = { id: "all", name: "Все категории", slug: "" };
                        document.getElementById('current-category').innerText = "Все категории";
                    } else {
                        selectedCity = { id: "all", name: "Вся Беларусь" };
                        document.getElementById('current-location').innerText = "Вся Беларусь";
                    }
                    showScreen('main-screen');
                };
                container.appendChild(allItem);
            }

            const items = data.filter(item => item.parent_id === parentId);

            items.forEach(item => {
                const hasChildren = data.some(child => child.parent_id === item.id);

                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <span style="display:flex; gap:8px; align-items:center;">
                        ${hasChildren ? '<span class="arrow">›</span>' : '<span class="check-mark" style="display:block; color:var(--btn);">✓</span>'}
                    </span>
                `;

                div.onclick = () => {
                    if (hasChildren) {
                        historyStack.push({ id: parentId, name: title });
                        renderList(item.id, item.name);
                    } else {
                        if (currentListType === 'category') {
                            selectedCategory = { id: item.id, name: item.name, slug: item.slug };
                            document.getElementById('current-category').innerText = item.name;
                        } else {
                            selectedCity = { id: item.id, name: item.name };
                            document.getElementById('current-location').innerText = item.name;
                        }
                        showScreen('main-screen');
                    }
                };
                container.appendChild(div);
            });
        }

        function goBack() {
            if (historyStack.length > 0) {
                const prevState = historyStack.pop();
                renderList(prevState.id, prevState.name);
            } else {
                showScreen('main-screen');
            }
        }

        function sendData() {
            const data = {
                query: document.getElementById('query').value || "",
                category_slug: selectedCategory.slug,
                category_name: selectedCategory.name,
                region_id: selectedCity.id,
                region_name: selectedCity.name,
                price_min: Number(document.getElementById('price_min').value) || 0,
                price_max: Number(document.getElementById('price_max').value) || 0
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
