<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kufar Monitor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #17212b);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #708499);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn_text: var(--tg-theme-button-text-color, #ffffff);
            --card_bg: var(--tg-theme-secondary-bg-color, #232e3c);
            --border: var(--tg-theme-section-separator-color, #2f3b4a);
            --green: #34c759; /* Зеленый цвет для галочек как у Kufar */
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .screen { display: none; flex-direction: column; height: 100vh; }
        .screen.active { display: flex; }
        .main-content { padding: 16px; padding-bottom: 90px; flex: 1; overflow-y: auto; }
        h1 { font-size: 20px; margin: 0 0 16px 0; }
        
        /* Фикс инпутов цены */
        .search-input { width: 100%; background-color: var(--card_bg); border: none; padding: 14px; border-radius: 10px; color: var(--text); font-size: 16px; box-sizing: border-box; margin-bottom: 20px; }
        .menu-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 16px; touch-action: manipulation; }
        .menu-item .value { color: var(--hint); text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .price-block { margin-top: 24px; }
        .price-inputs { display: flex; gap: 12px; width: 100%; }
        .price-inputs input { 
            flex: 1 1 0; 
            min-width: 0; /* Чтобы не вылезали за края */
            width: 100%;
            background-color: var(--card_bg); 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            color: var(--text); 
            font-size: 16px; 
            box-sizing: border-box;
        }
        
        .bottom-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background-color: var(--bg); border-top: 1px solid var(--border); }
        .save-btn { width: 100%; padding: 16px; background-color: var(--btn); color: var(--btn_text); border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .header { display: flex; align-items: center; padding: 16px; }
        .back-btn { font-size: 24px; padding-right: 16px; color: var(--btn); cursor: pointer; touch-action: manipulation; }
        .list-container { padding: 0 16px; overflow-y: auto; flex: 1; }
        
        /* Элемент списка с чекбоксом */
        .list-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0; border-bottom: 1px solid var(--border); 
            font-size: 16px; cursor: pointer; touch-action: manipulation;
        }
        .list-item:active { background-color: var(--card_bg); }
        
        /* Квадратный чекбокс */
        .checkbox {
            width: 22px; height: 22px;
            border: 2px solid var(--hint);
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            box-sizing: border-box;
        }
        .list-item.selected .checkbox {
            background-color: var(--green);
            border-color: var(--green);
        }
        .checkbox::after {
            content: '';
            display: none;
            width: 6px; height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .list-item.selected .checkbox::after { display: block; }
        
        .arrow { color: var(--hint); font-size: 18px; padding: 0 8px; }
        
        /* Нижняя панель для списков */
        .list-bottom-btn { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background-color: var(--bg); }
        .apply-btn { width: 100%; padding: 16px; background-color: var(--green); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="main-screen" class="screen active">
        <div class="main-content">
            <h1>Новый поиск</h1>
            <input type="text" id="query" class="search-input" placeholder="🔍 Что вы ищете?">
            <div class="menu-item" onclick="openList('category')">
                <div class="label">📦 Категория</div>
                <div class="value"><span id="current-category">Все категории</span> ›</div>
            </div>
            <div class="menu-item" onclick="openList('location')">
                <div class="label">📍 Локация</div>
                <div class="value"><span id="current-location">Вся Беларусь</span> ›</div>
            </div>
            <div class="price-block">
                <div class="price-title">Цена (BYN)</div>
                <div class="price-inputs">
                    <input type="number" id="price_min" placeholder="От">
                    <input type="number" id="price_max" placeholder="До">
                </div>
            </div>
        </div>
        <div class="bottom-btn"><button class="save-btn" onclick="sendData()">Сохранить и начать</button></div>
    </div>

    <div id="list-screen" class="screen">
        <div class="header">
            <div class="back-btn" onclick="goBack()">←</div>
            <h2 id="list-title">Выбор</h2>
        </div>
        <div class="list-container" id="list-container"></div>
        <!-- Кнопка Применить для списков -->
        <div class="list-bottom-btn" id="apply-container" style="display: none;">
            <button class="apply-btn" onclick="showScreen('main-screen')">Применить</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let selectedCategory = { id: "all", name: "Все категории", slug: "" };
        let selectedCity = { id: "all", name: "Вся Беларусь", slug: "" };
        
        let categoriesData = [];
        let regionsData = [];
        let currentListType = "";
        let historyStack = []; 

        fetch('categories.json').then(r => r.json()).then(data => categoriesData = data);
        fetch('regions.json').then(r => r.json()).then(data => regionsData = data);

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function openList(type) {
            currentListType = type;
            historyStack = [{ id: "0", name: type === 'category' ? "Категории" : "Локация" }];
            renderList("0", type === 'category' ? "Категории" : "Локация");
            showScreen('list-screen');
        }

        function renderList(parentId, title) {
            document.getElementById('list-title').innerText = title;
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            // Показываем кнопку "Применить" только на внутренних экранах
            document.getElementById('apply-container').style.display = (parentId === "0") ? "none" : "block";
            // Отступ снизу, чтобы кнопка не перекрывала список
            container.style.paddingBottom = (parentId === "0") ? "0" : "80px";

            const data = currentListType === 'category' ? categoriesData : regionsData;

            // 1. Кнопка "Все категории" / "Вся Беларусь" на корневом экране
            if (parentId === "0") {
                const allItem = document.createElement('div');
                allItem.className = 'list-item';
                const isAll = (currentListType === 'category' && selectedCategory.id === 'all') || 
                              (currentListType === 'location' && selectedCity.id === 'all');
                if (isAll) allItem.classList.add('selected');
                
                allItem.innerHTML = `
                    <span>${currentListType === 'category' ? 'Все категории' : 'Вся Беларусь'}</span>
                    <div class="checkbox"></div>
                `;
                allItem.onclick = () => {
                    if (currentListType === 'category') {
                        selectedCategory = { id: "all", name: "Все категории", slug: "" };
                        document.getElementById('current-category').innerText = "Все категории";
                    } else {
                        selectedCity = { id: "all", name: "Вся Беларусь", slug: "" };
                        document.getElementById('current-location').innerText = "Вся Беларусь";
                    }
                    showScreen('main-screen');
                };
                container.appendChild(allItem);
            }

            // 2. Список элементов
            const items = data.filter(item => item.parent_id === parentId);

            items.forEach(item => {
                const hasChildren = data.some(child => child.parent_id === item.id);
                
                // Проверка на выделение (для локаций учитываем parent_id, так как id могут дублироваться)
                let isSelected = false;
                if (currentListType === 'category') {
                    isSelected = (selectedCategory.id === item.id);
                } else {
                    isSelected = (selectedCity.id === item.id && selectedCity.name === item.name);
                }

                const div = document.createElement('div');
                div.className = `list-item ${isSelected ? 'selected' : ''}`;
                
                // Внутренняя структура строки
                div.innerHTML = `
                    <div style="display:flex; align-items:center; flex:1;" onclick="event.stopPropagation(); selectItem('${item.id}', '${item.name}', '${item.slug || ''}', ${hasChildren})">
                        <span>${item.name}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="checkbox" onclick="event.stopPropagation(); selectItem('${item.id}', '${item.name}', '${item.slug || ''}', ${hasChildren})"></div>
                        ${hasChildren ? `<span class="arrow" onclick="event.stopPropagation(); goInside('${item.id}', '${item.name}')">›</span>` : ''}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Выбор элемента (ставит галочку)
        function selectItem(id, name, slug, hasChildren) {
            if (currentListType === 'category') {
                selectedCategory = { id: id, name: name, slug: slug };
                document.getElementById('current-category').innerText = name;
            } else {
                selectedCity = { id: id, name: name, slug: slug };
                document.getElementById('current-location').innerText = name;
            }
            
            // Обновляем визуальное состояние (снимаем галочки со всех, ставим на этот)
            const items = document.querySelectorAll('.list-item');
            items.forEach(el => el.classList.remove('selected'));
            event.currentTarget.closest('.list-item').classList.add('selected');
            
            // Если это конечная категория (без детей), сразу закрываем
            if (!hasChildren) {
                showScreen('main-screen');
            }
        }

        // Заход внутрь категории/локации
        function goInside(id, name) {
            historyStack.push({ id: id, name: name });
            renderList(id, name);
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop();
                const prev = historyStack[historyStack.length - 1];
                renderList(prev.id, prev.name);
            } else {
                showScreen('main-screen');
            }
        }

        function sendData() {
            const data = {
                query: document.getElementById('query').value || "",
                category_slug: selectedCategory.slug,
                category_name: selectedCategory.name,
                region_slug: selectedCity.slug, // ВАЖНО: шлем слаг локации
                region_name: selectedCity.name,
                price_min: Number(document.getElementById('price_min').value) || 0,
                price_max: Number(document.getElementById('price_max').value) || 0
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
